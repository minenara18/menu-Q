name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderq
          POSTGRES_PASSWORD: orderq_ci_password
          POSTGRES_DB: orderq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderq -d orderq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TZ: UTC
      DATABASE_URL: postgresql://orderq:orderq_ci_password@localhost:5432/orderq?schema=public
      DATABASE_URL_TEST: postgresql://orderq:orderq_ci_password@localhost:5432/orderq_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long-000
      QRIS_ENABLED: 'false'
      PORT: '3000'

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=orderq_ci_password pg_isready -h localhost -U orderq -d orderq; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Create isolated test database
        run: PGPASSWORD=orderq_ci_password psql -h localhost -U orderq -d orderq -c 'CREATE DATABASE orderq_test;'

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build shared contracts
        run: npm run build:shared

      - name: Build API
        run: npm run build:api

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test --workspace @order-q/api

      - name: Mobile typecheck
        run: npm run typecheck --workspace apps/mobile

      - name: Mobile lint
        run: npm run lint --workspace apps/mobile

      - name: Mobile tests
        run: npm test --workspace apps/mobile

      - name: Apply migrations (dev-like DB)
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Apply migrations (test DB)
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Integration tests
        run: npm run test:integration --workspace @order-q/api
